{{ define "main" }}

<article>

  <p class="meta-date">
    <time datetime="{{ .Date.Format " 2006-01-02" }}">
      {{ .Date.Format "02 Jan, 2006" }}
    </time>
  </p>

  <h2 class="title">{{ .Title }}</h2>

  {{ if .Params.concepts }}
  <p class="concepts">
    Concepts: {{ delimit .Params.concepts ", " }}
  </p>
  {{ end }}

  <div class="content">
    {{ .Content }}
  </div>

</article>

{{ end }}
